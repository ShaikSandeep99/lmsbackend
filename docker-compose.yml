services:
  postgres:
    image: postgres:17
    container_name: lms
    restart: always

    # Map container port 5432 to host port 5432
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"

    # Persist database data locally in ./pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data
